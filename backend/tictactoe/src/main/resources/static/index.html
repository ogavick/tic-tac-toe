<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online TicTacToe</title>
<style>
body{font-family:Arial;background:#0f0f0f;color:#fff;display:flex;flex-direction:column;align-items:center;padding:15px;min-height:100vh}
h2{margin:10px}
#score{display:flex;gap:20px;margin:10px;font-size:18px;background:#1e1e1e;padding:12px 20px;border-radius:12px}
.score-box{text-align:center}
.score-box span{display:block;font-size:24px;font-weight:bold}
#status{font-size:22px;margin:15px;font-weight:bold;height:30px}
#board{display:grid;grid-template-columns:repeat(3,110px);gap:8px;margin:10px}
.cell{width:110px;height:110px;background:#1e1e1e;display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:bold;cursor:pointer;border-radius:15px;transition:0.2s}
.cell:hover{background:#2a2a2a}
.cell.win{background:#00ff88!important;color:#000}
.cell.draw{opacity:0.5}
button{padding:12px 22px;font-size:15px;margin:5px;border-radius:10px;border:none;cursor:pointer;font-weight:bold}
.btn-white{background:#fff;color:#111}
.btn-dark{background:#222;color:#fff;border:1px solid #444}
#you{margin-top:10px;opacity:0.7}
</style>
</head>
<body>
<h2>Online TicTacToe</h2>
<div id="score">
  <div class="score-box">Player X <span id="sx">0</span></div>
  <div class="score-box">Draws <span id="sd">0</span></div>
  <div class="score-box">Player O <span id="so">0</span></div>
</div>
<div id="status">Connecting...</div>
<div id="board"></div>
<div style="margin-top:15px">
  <button class="btn-white" onclick="resetGame()">Reset Board</button>
  <button class="btn-dark" onclick="resetScores()">Reset Scores</button>
  <button class="btn-dark" onclick="switchPlayer()">Switch: <span id="ps"></span></button>
</div>
<p id="you"></p>

<script>
  const API = "https://goliath-purse-pry.ngrok-free.dev";

const boardDiv = document.getElementById('board');
const statusDiv = document.getElementById('status');
let myPlayer = localStorage.getItem('player') || (Math.random() > 0.5? 'X' : 'O');
localStorage.setItem('player', myPlayer);

let scores = JSON.parse(localStorage.getItem('scores') || '{"X":0,"O":0,"D":0}');
let lastWinner = null;
let isGameOver = false;

function updateUI(){
  document.getElementById('sx').innerText = scores.X;
  document.getElementById('so').innerText = scores.O;
  document.getElementById('sd').innerText = scores.D;
  document.getElementById('ps').innerText = myPlayer;
  document.getElementById('you').innerText = 'You are: ' + myPlayer;
}

function getWinLine(board){
  const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  for(let l of lines){
    if(board[l[0]] && board[l[0]]===board[l[1]] && board[l[0]]===board[l[2]]) return l;
  }
  return null;
}

function draw(state){
  boardDiv.innerHTML = '';
  const winLine = state.winner && state.winner!== 'DRAW'? getWinLine(state.board) : null;
  isGameOver =!!state.winner;

  state.board.forEach((val, i) => {
    let d = document.createElement('div');
    d.className = 'cell';
    if(winLine && winLine.includes(i)) d.classList.add('win');
    if(state.winner === 'DRAW') d.classList.add('draw');
    d.innerText = val;
    d.onclick = () => { if(!isGameOver) move(i); };
    boardDiv.appendChild(d);
  });

  if(state.winner){
    if(state.winner === 'DRAW'){
      statusDiv.innerText = "It's a Draw!";
      statusDiv.style.color = "#ffcc00";
      if(lastWinner!== 'DRAW'){ scores.D++; lastWinner='DRAW'; }
    } else {
      statusDiv.innerText = "Winner: " + state.winner + " 🎉";
      statusDiv.style.color = "#00ff88";
      if(lastWinner!== state.winner){ scores[state.winner]++; lastWinner = state.winner; }
    }
    // Auto reset after 2.5 sec
    if(lastWinner) {
      localStorage.setItem('scores', JSON.stringify(scores));
      updateUI();
      setTimeout(()=>{ if(isGameOver) resetGame(); }, 2500);
    }
  } else {
    statusDiv.innerText = 'Turn: ' + state.turn + (state.turn===myPlayer? ' (Your turn)' : " (Waiting)");
    statusDiv.style.color = state.turn===myPlayer? "#fff" : "#888";
    lastWinner = null;
  }
  updateUI();
}

async function load(){
  try{
    let r = await fetch('/state');
    if(!r.ok) throw new Error(`Request failed (${r.status})`);
    draw(await r.json());
  }catch(e){ statusDiv.innerText = 'Backend not reachable'; }
}
async function move(i){
  try{
    let r = await fetch('/move', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({index:i, player:myPlayer})
    });
    if(!r.ok) {
      const error = await r.json();
      statusDiv.innerText = error.error || `Move failed (${r.status})`;
      return;
    }
    draw(await r.json());
  }catch(e){ statusDiv.innerText = 'Could not submit move'; }
}
async function resetGame(){
  try{
    let r = await fetch('/reset', {method:'POST'});
    if(!r.ok) throw new Error(`Request failed (${r.status})`);
    lastWinner = null;
    isGameOver = false;
    draw(await r.json());
  }catch(e){ statusDiv.innerText = 'Could not reset the game'; }
}
function resetScores(){
  scores = {X:0,O:0,D:0};
  localStorage.setItem('scores', JSON.stringify(scores));
  updateUI();
}
function switchPlayer(){
  myPlayer = myPlayer === 'X'? 'O' : 'X';
  localStorage.setItem('player', myPlayer);
  updateUI();
  load();
}

updateUI();
load();
setInterval(load, 1500);
</script>
</body>
</html>
